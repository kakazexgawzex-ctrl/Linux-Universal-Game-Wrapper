[Game]
name = GAME_NAME_HERE
exe = Game.exe
version = 1.0

[Runner]
# Options: bundled, system, proton
type = bundled
# Path relative to this directory, or absolute
path = runner
# Binary name: wine, wine64, proton, etc.
binary = wine

[Display]
resolution = auto
windowed = no
fix_resolution = no

[Dependencies]
# Space-separated winetricks verbs: vcrun2022 d3dx9 dotnet48 xact
verbs = vcrun2022

[Performance]
esync = yes
fsync = no
gamemode = auto
